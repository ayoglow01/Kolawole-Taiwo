<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Placeholder portrait monogram for Kolawole Taiwo Olawale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182D47"/>
      <stop offset="1" stop-color="#101F33"/>
    </linearGradient>
    <pattern id="hairlines" width="200" height="1000" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="1000" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#hairlines)"/>

  <!-- Inner gold frame -->
  <rect x="34" y="34" width="732" height="932" rx="26" fill="none" stroke="#C5A46D" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="46" y="46" width="708" height="908" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Subtle neutral portrait silhouette -->
  <g fill="#FFFFFF" fill-opacity="0.05">
    <circle cx="400" cy="380" r="150"/>
    <path d="M400 560c150 0 250 96 268 250 4 34-20 60-54 60H186c-34 0-58-26-54-60 18-154 118-250 268-250z"/>
  </g>

  <!-- Monogram -->
  <circle cx="400" cy="430" r="118" fill="#14263D" fill-opacity="0.72" stroke="#C5A46D" stroke-opacity="0.75" stroke-width="2"/>
  <circle cx="400" cy="430" r="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1"/>
  <text x="400" y="462" text-anchor="middle" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="6" fill="#E5D5B8">KTO</text>

  <!-- Name & location -->
  <line x1="300" y1="640" x2="500" y2="640" stroke="#C5A46D" stroke-opacity="0.6" stroke-width="1.5"/>
  <text x="400" y="692" text-anchor="middle" font-family="'Plus Jakarta Sans','Segoe UI',Arial,sans-serif" font-size="24" font-weight="600" letter-spacing="7" fill="#F2F5F7">KOLAWOLE TAIWO OLAWALE</text>
  <text x="400" y="730" text-anchor="middle" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="16" font-weight="500" letter-spacing="4" fill="#B9C4CF">LAGOS, NIGERIA</text>

  <text x="400" y="910" text-anchor="middle" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="500" letter-spacing="3" fill="#B9C4CF" fill-opacity="0.75">PROFESSIONAL PORTRAIT COMING SOON</text>
</svg>
